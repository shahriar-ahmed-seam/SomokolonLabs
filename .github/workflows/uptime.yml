name: Demo uptime

# Monitoring that exists because the failure already happened: a released Vercel
# subdomain was reclaimed by a third party and quietly served an unrelated site
# behind a 200, with our product still listed on somokolonlabs.com. This checks
# every demo link in the catalogue and opens an issue when one breaks.

on:
  schedule:
    # Every six hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Only when the catalogue or the checker itself changes.
    paths:
      - "src/lib/products.ts"
      - "scripts/health-check.mjs"
      - "scripts/lib/read-catalogue.mjs"
      - ".github/workflows/uptime.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    name: Verify every demo link
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # No npm install needed — the checker uses only the Node standard library.
      - name: Run health check
        id: health
        run: |
          set +e
          node scripts/health-check.mjs | tee health.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Demo link health"
            echo
            echo '```'
            cat health.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update an issue on failure
        if: steps.health.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('health.txt', 'utf8');
            const title = 'Demo link health check failing';
            const body = [
              'The scheduled demo health check found at least one broken link.',
              '',
              'Every failing entry is a product on somokolonlabs.com whose',
              '"Open live demo" button sends visitors somewhere broken.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              '**Verdicts**',
              '- `HTTP_4xx` / `HTTP_5xx` — the deployment is erroring',
              '- `UNREACHABLE` / `TIMEOUT` — DNS or the host is gone',
              '- `NOT_FOUND_SHELL` — Vercel says the deployment does not exist',
              '- `WRONG_CONTENT` — responded 200 but the page is not our product.',
              '  Treat this as urgent: it usually means the subdomain was released',
              '  and somebody else now owns it.',
              '',
              'Fix by redeploying, or remove `demoUrl` for that product in',
              '`src/lib/products.ts` so the site stops linking it.',
              '',
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['uptime'],
              });
            }

      - name: Close the issue once everything is healthy
        if: steps.health.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'All demo links healthy again. Closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Fail the run if any demo is down
        if: steps.health.outputs.exit_code != '0'
        run: exit 1

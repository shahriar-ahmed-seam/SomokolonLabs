services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: somokolon-labs-site:local
    ports:
      - "3000:3000"
    env_file:
      # Optional — the service starts without it. Copy .env.example to .env.local
      # if you need Unsplash or Resend keys at build/run time.
      - path: .env.local
        required: false
    restart: unless-stopped
